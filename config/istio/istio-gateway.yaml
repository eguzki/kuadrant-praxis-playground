---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-gateway
---
# Istio-managed Gateway. Istio auto-provisions a Deployment + Service named
# `ingress-gateway-istio` in this namespace. Pass-through for now (no Kuadrant
# policy attached); the Praxis gateway is where token rate limiting is tested.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ingress-gateway
  namespace: ingress-gateway
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
