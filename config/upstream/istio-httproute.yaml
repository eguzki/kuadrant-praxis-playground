---
# Routes traffic from the Istio-managed gateway to the shared upstream.
# Lives in the `llm` namespace (same as the backend Service, so no
# ReferenceGrant is needed) and attaches cross-namespace to the gateway via
# parentRef. The gateway listener allows routes from all namespaces.
#
# OpenAI-shaped traffic (/v1/chat/completions, /v1/models) -> inference-sim.
# Everything else under /v1 and /v1beta -> mockserver.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-route
  namespace: llm
spec:
  parentRefs:
    - name: ingress-gateway
      namespace: ingress-gateway
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/chat/completions
        - path:
            type: PathPrefix
            value: /v1/models
      backendRefs:
        - name: llm-d-inference-sim
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /v1/messages
        - path:
            type: PathPrefix
            value: /v1beta/models
      backendRefs:
        - name: mock-llm
          port: 1080
