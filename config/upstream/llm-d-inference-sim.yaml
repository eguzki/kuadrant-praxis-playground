---
# OpenAI-compatible inference simulator. Returns real token usage in the
# response body (usage.total_tokens), which is what drives token rate limiting.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-inference-sim
  namespace: llm
  labels:
    app: llm-d-inference-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-d-inference-sim
  template:
    metadata:
      labels:
        app: llm-d-inference-sim
    spec:
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.1.1
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - mock
            - --port
            - "8000"
            - --mode
            - echo
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-inference-sim
  namespace: llm
  labels:
    app: llm-d-inference-sim
spec:
  selector:
    app: llm-d-inference-sim
  ports:
    - name: http
      port: 8000
      targetPort: 8000
