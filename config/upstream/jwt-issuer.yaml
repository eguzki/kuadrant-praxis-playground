---
# Static JWKS "issuer" for the acceptance tests. Serves a fixed JWKS document at
#   /.well-known/jwks.json
# so Kuadrant Authorino (jwt.jwksUrl) and the Praxis `policy` filter identity
# plugins can verify the RS256 test tokens minted by scripts/lib-jwt.sh.
#
# This issues NO tokens at runtime — tokens are signed offline with the matching
# private key (kept in ${CACHE_DIR}/jwt, never in-cluster). The `jwt-issuer-jwks`
# ConfigMap (the public JWKS) is created by scripts/deploy-jwt-issuer.sh.
#
# Lives in the `llm` namespace alongside the shared upstream.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwt-issuer
  namespace: llm
  labels:
    app: jwt-issuer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jwt-issuer
  template:
    metadata:
      labels:
        app: jwt-issuer
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: jwks
              mountPath: /usr/share/nginx/html/.well-known
              readOnly: true
          readinessProbe:
            httpGet:
              path: /.well-known/jwks.json
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: nginx-conf
          configMap:
            name: jwt-issuer-nginx
        - name: jwks
          configMap:
            name: jwt-issuer-jwks
---
# nginx listens on 8080 and serves the mounted JWKS (incl. the dot-directory).
apiVersion: v1
kind: ConfigMap
metadata:
  name: jwt-issuer-nginx
  namespace: llm
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      location = /.well-known/jwks.json {
        default_type application/json;
        add_header Cache-Control "no-store";
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: jwt-issuer
  namespace: llm
  labels:
    app: jwt-issuer
spec:
  selector:
    app: jwt-issuer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
