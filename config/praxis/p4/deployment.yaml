---
apiVersion: v1
kind: Namespace
metadata:
  name: praxis-p4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-ai
  namespace: praxis-p4
  labels:
    app: praxis-ai
    offering: p4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praxis-ai
  template:
    metadata:
      labels:
        app: praxis-ai
        offering: p4
      annotations:
        config/checksum: "v1"
    spec:
      containers:
        - name: praxis-ai
          # Built with experimental-ratelimit (PPE ratelimit/limitador plugin,
          # embedded in-memory). See scripts/05-build-praxis-image-p4.sh.
          image: praxis-ai:ratelimit
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/praxis/praxis-ai.yaml"
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9901
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: praxis-ai-config
