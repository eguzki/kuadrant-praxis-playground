---
# Offering P4 -- Praxis PPE `ratelimit/limitador` plugin (request-count, EMBEDDED
# in-memory Limitador). Plugin from praxis-proxy/policy (merged PR #178, engine
# 0.5.0 line).
#
# Chain: policy -> router -> load_balancer. The `policy` filter embeds the Praxis
# Policy Engine; the policy document (policy.yaml below) declares:
#   - identity/jwt   : verifies the issuer's RS256 JWT (JWKS over plaintext http),
#                      maps sub -> subject.id, exposes `tier` claim
#   - p4-ratelimit   : per-request-count budget keyed on the `tier` claim,
#                      evaluated in-process, at the ratelimit.post_identity hook
#
# MERGED-DESIGN NOTE: the ratelimit plugin now runs at the new engine hooks
# `ratelimit.pre_identity` / `ratelimit.post_identity` (NOT `http.request`, and it
# "cannot run from an APL run(name) step"). The host (core's policy filter) must
# invoke those hooks around identity resolution -- that wiring is tracked upstream
# by praxis-proxy/praxis#1478 and is NOT in any released core, so the P4 image
# carries a minimal forward-port that invokes ratelimit.post_identity after
# identity.resolve (see scripts/05-build-praxis-image-p4.sh).
#
# Config shape (merged design):
#   * the plugin declares its stage via `hooks: [ratelimit.post_identity]`;
#   * a `rate_limits:` list (here at `global`) SELECTS the limiter (like
#     `authentication:` selects identity resolvers) -- NOT authorization/run();
#   * enterprise exemption falls out of the limit CONDITIONS (no limit matches
#     tier == enterprise -> unmetered), so there is no APL when-gate;
#   * over-budget denial is HTTP 429; a missing/non-string bound attribute denies
#     (so a token with no `tier` claim is denied, not defaulted).
#
# Requires image praxis-ai:ratelimit (experimental-ratelimit + the #1478 host
# forward-port). `allow_private_idp: true` lets the JWKS fetch reach the in-cluster
# issuer ClusterIP. No body_access (the plugin acts pre-body, around identity).
apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-ai-config
  namespace: praxis-p4
data:
  praxis-ai.yaml: |
    admin:
      metrics_address: "0.0.0.0:9901"

    listeners:
      - name: ai
        address: "0.0.0.0:8080"
        filter_chains:
          - main

    filter_chains:
      - name: main
        filters:
          - filter: policy
            config_path: /etc/praxis/policy.yaml
            # Permit the policy-engine JWKS fetch to reach a private cluster
            # ClusterIP. No body_access: the plugin acts around identity.resolve.
            allow_private_idp: true

          - filter: router
            routes:
              - path: "/v1/chat/completions"
                cluster: openai_backend
              - path: "/v1/embeddings"
                cluster: openai_backend
              - path_prefix: "/v1/models"
                cluster: openai_backend
              - path: "/v1/messages"
                cluster: anthropic_backend
              - path_prefix: "/v1beta/models/"
                cluster: gemini_backend

          - filter: access_log

          - filter: load_balancer
            clusters:
              - name: openai_backend
                endpoints:
                  - "mock-llm.llm.svc.cluster.local:1080"
              - name: anthropic_backend
                endpoints:
                  - "mock-llm.llm.svc.cluster.local:1080"
              - name: gemini_backend
                endpoints:
                  - "mock-llm.llm.svc.cluster.local:1080"

    insecure_options:
      allow_private_upstreams: true
      allow_private_endpoints: true

  policy.yaml: |
    plugins:
      - name: jwt-user
        kind: identity/jwt
        hooks: [identity.resolve]
        on_error: fail
        # Needs perform_http to fetch the JWKS from the issuer.
        capabilities: [perform_http]
        config:
          # Merged engine prefers `credential:` over the deprecated `header:`.
          credential:
            kind: header
            name: Authorization
          trusted_issuers:
            - issuer: "https://jwt-issuer.praxis.local"
              audiences: ["praxis-playground"]
              algorithms: ["RS256"]
              decoding_key:
                kind: jwks_url
                url: "http://jwt-issuer.llm.svc.cluster.local:8080/.well-known/jwks.json"
                insecure_http: true
          claim_mapper: standard
          # Expose the custom `tier` claim so the ratelimit bindings can read it.
          claims:
            include: [tier]

      - name: p4-ratelimit
        kind: ratelimit/limitador
        # The stage is selected by the hook the plugin declares. post_identity
        # lets limits key on the resolved subject/claims (vs pre_identity, which
        # runs before token verification and keys on client address).
        hooks: [ratelimit.post_identity]
        mode: sequential
        # read_subject -> subject.id; read_headers -> http.method; read_claims ->
        # claim.tier. A missing/non-string bound attribute DENIES the request.
        capabilities: [read_subject, read_headers, read_claims]
        config:
          namespace: praxis-p4-requests
          counter_capacity: 1000
          # Bind PPE attributes to flat CEL variable names used by the limits.
          bindings:
            subject_id: subject.id
            http_method: http.method
            tier: claim.tier
          # M5: multiple budgets, each keyed (`variables`) on the tier claim so
          # the per-tier counters are independent. Small on purpose (easy 429).
          # enterprise matches NO limit here -> unmetered (M1 exemption via
          # conditions, no APL when-gate needed).
          limits:
            - max: 5
              seconds: 60
              conditions: ["tier == 'gold'"]
              variables: ["tier"]
            - max: 2
              seconds: 60
              conditions: ["tier == 'silver'"]
              variables: ["tier"]
            # Default/catch-all for any other authenticated tier (e.g. `basic`);
            # excludes enterprise so enterprise stays unmetered.
            - max: 3
              seconds: 60
              conditions:
                - "tier != 'gold'"
                - "tier != 'silver'"
                - "tier != 'enterprise'"
              variables: ["tier"]

    global:
      authentication:
        - jwt-user
      # SELECT the rate limiter (merged design: like `authentication:` selects
      # identity resolvers). The plugin's `hooks:` picks the stage; this list
      # wires it in. NOT an APL authorization/run() step (which the merged engine
      # rejects for a rate-limit-only plugin).
      rate_limits:
        - p4-ratelimit
      # require(authenticated) keeps the http.request authorization path active,
      # which is where the host forward-port invokes ratelimit.post_identity
      # (after identity.resolve); it also rejects unauthenticated calls (401).
      authorization:
        pre_invocation:
          - "require(authenticated)"
