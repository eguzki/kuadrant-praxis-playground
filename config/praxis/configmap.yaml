---
apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-ai-config
  namespace: praxis-gateway
data:
  praxis-ai.yaml: |
    # Praxis AI gateway config for the playground.
    #
    # Fronts the SAME shared upstream as the Istio gateway (namespace `llm`)
    # and enforces token rate limiting natively via the experimental
    # `token_rate_limit` filter (built into the image, see scripts/05).
    #
    # Routing:
    #   /v1/chat/completions, /v1/models  -> llm-d-inference-sim (OpenAI, real usage)
    #   /v1/messages                      -> mockserver (Anthropic shape)
    #   /v1beta/models/...                -> mockserver (Gemini shape)
    listeners:
      - name: ai
        address: "0.0.0.0:8080"
        filter_chains:
          - main

    filter_chains:
      - name: main
        filters:
          - filter: router
            routes:
              - path: "/v1/chat/completions"
                cluster: openai_backend
              - path_prefix: "/v1/models"
                cluster: openai_backend
              - path: "/v1/messages"
                cluster: anthropic_backend
              - path_prefix: "/v1beta/models/"
                cluster: gemini_backend

          # Reserve an estimated token cost at admission, reconcile against the
          # provider-reported usage once the response completes. 429 when the
          # sliding-window budget can't cover the estimate.
          # Small capacity on purpose so the limit is easy to trip in a demo.
          - filter: token_rate_limit
            key: global
            default_weights:
              input: 1.0
              output: 1.0
            rules:
              - name: default
                algorithm: sliding_window
                window: 1m
                capacity: 200
                reserved_tokens: 50

          # Parses OpenAI-shaped usage from the response body for reconciliation.
          - filter: token_count
            provider: openai

          - filter: access_log

          - filter: load_balancer
            clusters:
              - name: openai_backend
                endpoints:
                  - "llm-d-inference-sim.llm.svc.cluster.local:8000"
              - name: anthropic_backend
                endpoints:
                  - "mock-llm.llm.svc.cluster.local:1080"
              - name: gemini_backend
                endpoints:
                  - "mock-llm.llm.svc.cluster.local:1080"

    # Cluster Service IPs are private; allow proxying to them.
    insecure_options:
      allow_private_endpoints: true
