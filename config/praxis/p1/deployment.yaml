---
apiVersion: v1
kind: Namespace
metadata:
  name: praxis-p1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-ai
  namespace: praxis-p1
  labels:
    app: praxis-ai
    offering: p1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praxis-ai
  template:
    metadata:
      labels:
        app: praxis-ai
        offering: p1
      annotations:
        # Bump this to force a rollout when the ConfigMap changes.
        config/checksum: "v1"
    spec:
      containers:
        - name: praxis-ai
          # Base image (core rate_limit filter is always built in); serves P1 and P2.
          image: praxis-ai:dev
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/praxis/praxis-ai.yaml"
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9901
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: praxis-ai-config
