---
# Offering P2 -- Praxis `token_rate_limit` filter (data-plane, native).
#
# Budget selection (first-match rules):
#   tier=enterprise            -> bypass (not limited)
#   tier=gold  + model=gpt-4o  -> premium budget
#   tier=gold  (other models)  -> gold-basic budget
#   tier=silver                -> silver-basic budget
#   (anything else)            -> default budget
#
# Config API: docs/filters/token_rate_limit.md + examples/configs/token-rate-limit*.yaml
# in praxis-proxy/ai. x-tier is a request header here (verified-JWT-claim wiring
# comes with the P3/P4 identity work).
apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-ai-config
  namespace: praxis-p2
data:
  praxis-ai.yaml: |
    # Health + Prometheus metrics (/healthy, /ready, /metrics) on :9901.
    # Bind 0.0.0.0 so port-forward/scraping works (default is 127.0.0.1).
    admin:
      metrics_address: "0.0.0.0:9901"

    listeners:
      - name: ai
        address: "0.0.0.0:8080"
        filter_chains:
          - main

    filter_chains:
      - name: main
        filters:
          - filter: router
            routes:
              - path: "/v1/chat/completions"
                cluster: openai_backend
              - path: "/v1/embeddings"
                cluster: openai_backend
              - path_prefix: "/v1/models"
                cluster: openai_backend
              - path: "/v1/messages"
                cluster: anthropic_backend
              - path_prefix: "/v1beta/models/"
                cluster: gemini_backend

          # Promote the request-body `model` to X-Model (strips a client copy).
          - filter: model_to_header

          - filter: token_rate_limit
            key:
              dimensions:
                - model
                - header: x-tier
              missing: fallback
            max_keys: 100000
            default_weights:
              input: 1.0
              output: 1.0
              cached_input: 0.1
              cache_write: 1.25
              reasoning: 0.9
            rules:
              - name: enterprise-bypass
                match:
                  headers:
                    x-tier: enterprise
                algorithm: sliding_window
                window: 1h
                capacity: 1000000000
                reserved_tokens: 1

              - name: premium
                match:
                  headers:
                    x-tier: gold
                    x-model: gpt-4o
                algorithm: sliding_window
                window: 1m
                capacity: 20000
                reserved_tokens: 500
                tiers:
                  - capacity: 15000
                    action:
                      type: inject
                      headers:
                        X-Token-Budget-Tier: warning
                  - capacity: 18000
                    action:
                      type: inject
                      headers:
                        X-Token-Budget-Tier: degraded
                  - capacity: 20000
                    action:
                      type: deny

              - name: gold-basic
                match:
                  headers:
                    x-tier: gold
                algorithm: sliding_window
                window: 1m
                capacity: 12000
                reserved_tokens: 500

              - name: silver-basic
                match:
                  headers:
                    x-tier: silver
                algorithm: sliding_window
                window: 1m
                capacity: 3000
                reserved_tokens: 500

              - name: default
                algorithm: sliding_window
                window: 1m
                capacity: 200
                reserved_tokens: 50

          # Parse OpenAI usage for reconciliation. Declared AFTER token_rate_limit
          # (response hooks run in reverse), so token.* is written before TRL reads it.
          - filter: token_count
            provider: openai

          - filter: access_log

          - filter: load_balancer
            clusters:
              - name: openai_backend
                endpoints:
                  - "mock-llm.llm.svc.cluster.local:1080"
              - name: anthropic_backend
                endpoints:
                  - "mock-llm.llm.svc.cluster.local:1080"
              - name: gemini_backend
                endpoints:
                  - "mock-llm.llm.svc.cluster.local:1080"

    insecure_options:
      allow_private_upstreams: true
      allow_private_endpoints: true
